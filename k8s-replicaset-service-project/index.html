<!DOCTYPE html>
<html>
<head>
  <title>DevOps Live Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1> DevOps Live Status Dashboard</h1>
    <p><b>Status:</b> <span class="green">RUNNING</span></p>
    <p><b>Pod Name:</b> <span id="pod"></span></p>
    <p><b>Node:</b> <span id="node"></span></p>
    <p><b>Time:</b> <span id="time"></span></p>
    <p><b>Environment:</b> Production</p>
  </div>

<script src="app.js"></script>
</body>
</html>
